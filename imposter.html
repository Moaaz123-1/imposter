<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
/* ==============================
   IMPOSTER RESULTS PAGE
============================== */

.imposter-reveal {
    position: relative;
    min-height: 100vh;
    width: 100%;
    padding: 70px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    isolation: isolate;
    background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 122, 26, 0.13), transparent 55%),
        #080808;
    color: #f5f5f5;
    font-family: "Sora", sans-serif;
}

/* Background glow */
.imposter-reveal::before,
.imposter-reveal::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
}

.imposter-reveal::before {
    width: 320px;
    height: 320px;
    top: -170px;
    left: -100px;
    background: #ff7a1a;
    filter: blur(150px);
    opacity: 0.2;
}

.imposter-reveal::after {
    width: 300px;
    height: 300px;
    bottom: -180px;
    right: -100px;
    background: #ff4d00;
    filter: blur(140px);
    opacity: 0.16;
}

/* Main title */
.imposter-reveal h1 {
    position: relative;
    margin: 0 0 15px;
    text-align: center;
    color: #fff;
    font-size: clamp(1.8rem, 5vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: imposterTitleIn 0.8s ease both;
}

.imposter-reveal h1::after {
    content: "";
    display: block;
    width: 85px;
    height: 4px;
    margin: 18px auto 0;
    border-radius: 5px;
    background: #ff7a1a;
    box-shadow: 0 0 18px rgba(255, 122, 26, 0.7);
}

/* Imposter name */
.imposter-names {
    width: min(100%, 750px);
    margin: 30px 0;
    padding: 30px 20px;
    border: 1px solid rgba(255, 122, 26, 0.55);
    border-radius: 18px;
    background: linear-gradient(
        135deg,
        rgba(255, 122, 26, 0.12),
        rgba(255, 255, 255, 0.025)
    );
    color: #ff7a1a;
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    font-weight: 900;
    text-align: center;
    overflow-wrap: anywhere;
    box-shadow:
        0 0 35px rgba(255, 122, 26, 0.08),
        inset 0 0 25px rgba(255, 122, 26, 0.035);
    animation: imposterCardIn 0.7s 0.2s ease both;
}

/* Result information */
#voteResult,
.imposter-reveal > p {
    width: min(100%, 750px);
    margin: 10px 0;
    padding: 17px 20px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.035);
    color: #ddd;
    text-align: center;
    font-size: 1rem;
    line-height: 1.8;
}

#secretWord,
#secretCategory {
    color: #ff9a4d;
    font-weight: 800;
}

/* Guess results */
#guessResults {
    width: min(100%, 750px);
    margin: 22px 0;
    padding: 24px;
    border: 1px solid rgba(255, 122, 26, 0.2);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.025);
}

#guessResults h2 {
    margin: 0 0 18px;
    color: #ff7a1a;
    font-size: 1.15rem;
    letter-spacing: 1px;
    text-align: center;
}

#guessResults p {
    margin: 10px 0;
    padding: 13px 15px;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.045);
    color: #eee;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

/* Buttons */
.imposter-reveal button {
    min-width: 155px;
    margin: 8px;
    padding: 14px 22px;
    border: 1px solid #ff7a1a;
    border-radius: 9px;
    background: #ff7a1a;
    color: #111;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 900;
    letter-spacing: 0.8px;
    cursor: pointer;
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease,
        color 0.25s ease;
}

.imposter-reveal button:hover {
    transform: translateY(-4px);
    background: #ff9142;
    box-shadow: 0 8px 25px rgba(255, 122, 26, 0.25);
}

.imposter-reveal #homeBtn {
    background: transparent;
    color: #ff7a1a;
}

.imposter-reveal #homeBtn:hover {
    background: #ff7a1a;
    color: #111;
}

/* Animations */
@keyframes imposterTitleIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes imposterCardIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Mobile */
@media (max-width: 600px) {
    .imposter-reveal {
        padding: 45px 16px;
    }

    .imposter-names {
        padding: 24px 14px;
        margin: 22px 0;
    }

    #guessResults {
        padding: 17px;
    }

    .imposter-reveal button {
        width: 100%;
        max-width: 320px;
        margin: 6px 0;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    .imposter-reveal *,
    .imposter-reveal *::before,
    .imposter-reveal *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
    
    <section class="imposter-reveal">
    <h1>🕵️ THE IMPOSTER WAS...</h1>

    <div id="imposterNames" class="imposter-names"></div>

    <p id="voteResult"></p>

    <p>
        SECRET WORD:
        <span id="secretWord"></span>
    </p>

    <p>
        CATEGORY:
        <span id="secretCategory"></span>
    </p>

    <div id="guessResults"></div>

    <button id="scoreboardBtn">SCOREBOARD</button>
    <button id="playAgainBtn">PLAY AGAIN</button>
    <button id="homeBtn">BACK TO HOME</button>
</section>

<script>
const results = JSON.parse(
    localStorage.getItem("spyGameRoundResults") || "null"
);

const imposterNames = document.getElementById("imposterNames");
const voteResult = document.getElementById("voteResult");
const secretWord = document.getElementById("secretWord");
const secretCategory = document.getElementById("secretCategory");
const guessResults = document.getElementById("guessResults");

if (results) {
    imposterNames.textContent = results.spies.join(", ");
    voteResult.textContent = results.resultMessage;
    secretWord.textContent = results.secretWord;
    secretCategory.textContent = results.category.toUpperCase();

    guessResults.innerHTML = "<h2>IMPOSTER GUESSES</h2>";

    results.guessResults.forEach(guess => {
        const item = document.createElement("p");

        item.textContent = `${guess.name}: ${
            guess.correct ? "CORRECT GUESS ✅" : "WRONG GUESS ❌"
        }`;

        guessResults.appendChild(item);
    });
} else {
    imposterNames.textContent = "No round results found.";
}

document.getElementById("scoreboardBtn").onclick = () => {
    window.location.href = "scoreboard.html";
};

document.getElementById("playAgainBtn").onclick = () => {
    window.location.href = "game.html?newRound=" + Date.now();
};

document.getElementById("homeBtn").onclick = () => {
    localStorage.removeItem("spyGameScores");
    localStorage.removeItem("spyGamePlayerNames");
    localStorage.removeItem("spyGameRoundResults");

    window.location.href = "index.html";
};
</script>
</body>
</html>
